<!-- ベーステンプレートを適応する -->
{% extends 'base.html' %}
<!-- ヘッダー情報のページタイトルを設定する -->
{% block title %}Photo Detail{% endblock %}

    {% block contents %}
    <!-- Bootstrapのグリッドシステム -->
    <br>
    <div class="container">
        <!-- 行を配置 -->
        <div class="row">
            <!-- 列の左右に余白offset-3を入れる -->
            <div class="col offset-3">
                <form method="POST">
                    <br>
                    <h3>「{{object.title}}」を削除してもいいですか？</h3>
                    {% csrf_token %}
                    <button class="btn_02"
                            type="submit">削除</button>
                    <a href="{% url 'enright:photo_detail' object.pk %}"
                       class="btn_01">キャンセル</a>
            </div>
        </div>
    </div>
    {% endblock %}
