<!-- ベーステンプレートを適応する -->
{% extends 'base.html' %}
<!-- ヘッダー情報のページタイトルを設定する -->
{% block title %}Log out{% endblock %}

    {% block contents %}
    <!-- Bootstrapのグリッドシステム -->
    <div class="container">
        <!-- 行を配置 -->
        <div class="row">
            <!-- 列の上下パディングはpy-4 -->
            <div class="col py-4">
                <h3>パスワードをリセットしますか？</h3>
                <p>
                    登録済みのメールアドレスを入力してください。
                    パスワードリセットのリンクを記載したメールをすぐにお届けします。
                </p>
                <br>
                <!-- メール送信のためのフォームを配置 -->
                <form action="" method="POST" class="text-center">
                    {% csrf_token %}
                    <!-- formに格納されているインプットボックスとラベルを出力 -->
                    {{ form }}
                    <!-- 送信ボタン -->
                    <input type="submit" value="メールを受け取る" class="btn_01"/><br>
                </form>
                <br>
                <!-- トップページへのリンク -->
                <a href="{% url 'enright:index' %}" class="btn_01">トップページへ</a>
                <p></p>
                <hr>
            </div>
        </div>
    </div>
    {% endblock %}
